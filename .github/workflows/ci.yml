name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Wiederverwendbar: `auto-create-pr.yml` und `auto-merge.yml` rufen diesen
  # Lauf als Gate auf, bevor sie nach main mergen. Ohne das lief der
  # Auto-Merge an JEDER Pruefung vorbei — siehe die Kopfkommentare dort.
  workflow_call:

# Ein laufender CI-Lauf pro Branch reicht; aeltere Laeufe werden abgebrochen.
#
# `github.workflow` MUSS in der Gruppe stehen, seit `workflow_call` dazukam:
# bei einem PR aus `claude/**` laeuft dieser Lauf zweimal auf derselben
# `github.ref` — einmal direkt ueber den `pull_request`-Trigger, einmal als
# `verify`-Job von `auto-merge.yml`. Mit `ci-${{ github.ref }}` allein waeren
# beide in derselben Gruppe und haetten sich gegenseitig abgebrochen; der
# abgebrochene Lauf haette dann `needs: verify` scheitern lassen und den
# Auto-Merge blockiert. Bei einem aufgerufenen Lauf ist `github.workflow` der
# Name des AUFRUFERS, die Gruppen sind damit verschieden.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typecheck und Tests laufen bewusst NACHEINANDER (getrennte Steps).
      # Beide parallel im selben Runner haben lokal wie in CI OOM-Abbrueche
      # provoziert (tsc haelt den ganzen Programmgraph im Speicher).
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run --reporter=dot

      # ESLint laeuft bewusst NUR auf Fehler (--max-warnings ist nicht gesetzt).
      # `next.config.ts` hat `eslint: { ignoreDuringBuilds: true }`, der
      # Vercel-Build prueft also nichts davon; ohne diesen Schritt lief ESLint
      # ueberhaupt nirgends automatisch. Die ~20 offenen Warnungen (img-Tags,
      # ungenutzte Variablen) blockieren nichts und werden laufend abgebaut —
      # ein neuer FEHLER faellt jetzt hier auf statt gar nicht.
      - name: Lint (nur Fehler)
        run: npm run lint
