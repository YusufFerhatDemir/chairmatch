name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein laufender CI-Lauf pro Branch reicht; aeltere Laeufe werden abgebrochen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typecheck und Tests laufen bewusst NACHEINANDER (getrennte Steps).
      # Beide parallel im selben Runner haben lokal wie in CI OOM-Abbrueche
      # provoziert (tsc haelt den ganzen Programmgraph im Speicher).
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run --reporter=dot

      # ESLint laeuft bewusst NUR auf Fehler (--max-warnings ist nicht gesetzt).
      # `next.config.ts` hat `eslint: { ignoreDuringBuilds: true }`, der
      # Vercel-Build prueft also nichts davon; ohne diesen Schritt lief ESLint
      # ueberhaupt nirgends automatisch. Die ~20 offenen Warnungen (img-Tags,
      # ungenutzte Variablen) blockieren nichts und werden laufend abgebaut —
      # ein neuer FEHLER faellt jetzt hier auf statt gar nicht.
      - name: Lint (nur Fehler)
        run: npm run lint
